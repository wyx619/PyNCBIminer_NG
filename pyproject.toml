[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "PyNCBIminer-NG"
version = "2.0"
description = "A user-friendly graphical interface software for efficient and precise retrieval of GenBank data"
authors = [
    { name = "Ruijing Cheng" },{ name = "Yuxuan Wang" }
]
maintainers = [
    { name = "Xiaoting Xu" },
]
readme = "README.md"
urls = { homepage = "https://github.com/Xiaoting-Xu/PyNCBIminer" }
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=1.0.0",
    "numpy>=1.18.0",
    "PySide6>=6.0.0",
    "biopython>=1.78",
    "func_timeout>=4.3.5",
    "scipy",
    "scikit-learn",
    "markov-clustering",
    "networkx",
]

[project.scripts]
pyNCBIminer = "src.pyNCBIminer_00_main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.pyinstaller]
icon = "src/icons/app_icon.ico"

[dependency-groups]
dev = [
    "pyinstaller>=6.18.0",
    "Pillow>=10.0.0",
    "PySide6-Fluent-Widgets"
]
